<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#86EFAC" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fastop" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved / system theme before first paint (no flash)
      ;(function () {
        try {
          var t = localStorage.getItem('fastop-theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          if (location.pathname === '/') t = 'light' // the landing page is always light
          document.documentElement.setAttribute('data-theme', t)
          // The landing page opens straight away: no start-up loader in front of it
          if (location.pathname === '/') document.documentElement.classList.add('no-boot')
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Find what you need in any kind of shop, see where it is on the map, and go get it." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font loads without blocking the page: text shows at once in the system font, then swaps. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" /></noscript>
    <title>Fastop UG</title>
    <style>
      /* Instant start-up screen, shown before any JavaScript runs. Vue replaces it on mount. */
      html { background: #f4f9f5; }
      html[data-theme='dark'] { background: #07110b; }
      html.no-boot { background: #ffffff; }
      html.no-boot .boot { display: none; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font: 700 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #34493d; }
      html[data-theme='dark'] .boot { color: #bbd6c4; }
      .boot-in { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: boot-in .3s ease both; }
      .boot-cart { position: relative; width: 120px; height: 60px; }
      .boot-cart svg { position: absolute; left: 34px; bottom: 6px; width: 64px; height: 52px; animation: boot-bump .45s ease-in-out infinite; }
      .boot-cart .w { animation: boot-spin .5s linear infinite; }
      .boot-cart i { position: absolute; left: 0; height: 4px; border-radius: 4px; background: linear-gradient(90deg, transparent, #4ade80); animation: boot-dash .7s linear infinite; }
      .boot-cart i:nth-child(1) { top: 16px; width: 30px; }
      .boot-cart i:nth-child(2) { top: 28px; width: 40px; animation-delay: -.25s; }
      .boot-cart i:nth-child(3) { top: 40px; width: 24px; animation-delay: -.5s; }
      .boot-cart b { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: repeating-linear-gradient(90deg, #86efac 0 14px, transparent 14px 24px); animation: boot-road .5s linear infinite; }
      @keyframes boot-bump { 50% { transform: translateY(-2px) rotate(-1.5deg); } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-dash { from { transform: translateX(18px); opacity: 0; } 40% { opacity: 1; } to { transform: translateX(-14px); opacity: 0; } }
      @keyframes boot-road { to { background-position: -24px 0; } }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="Opening Fastop">
        <div class="boot-in">
          <div class="boot-cart">
            <i></i><i></i><i></i>
            <svg viewBox="0 0 64 52" aria-hidden="true">
              <path d="M4 6h8l7 26h30l7-20H15" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M20 18h33l-4.5 11H23z" fill="#86EFAC" opacity=".55" />
              <g class="w" style="transform-origin: 23px 43px"><circle cx="23" cy="43" r="5.5" fill="#14532D" /><path d="M23 39v8M19 43h8" stroke="#BBF7D0" stroke-width="1.6" /></g>
              <g class="w" style="transform-origin: 46px 43px"><circle cx="46" cy="43" r="5.5" fill="#14532D" /><path d="M46 39v8M42 43h8" stroke="#BBF7D0" stroke-width="1.6" /></g>
            </svg>
            <b></b>
          </div>
          <span>Opening Fastop…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
